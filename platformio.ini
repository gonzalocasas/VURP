; VURP rover firmware — PlatformIO config
; This one file tells PlatformIO everything: which board, which framework,
; and (later) which libraries to download automatically.

[env:seeed_xiao_esp32c3]
platform = espressif32        ; the ESP32 chip family
board = seeed_xiao_esp32c3    ; our exact board: Seeed XIAO ESP32-C3
framework = arduino           ; we write Arduino-style C++ (setup/loop)
monitor_speed = 115200        ; Serial Monitor speed — must match Serial.begin()

; Libraries — PlatformIO downloads these automatically on the next build.
lib_deps =
    adafruit/Adafruit NeoPixel        ; the LED ring
;   adafruit/Adafruit Motor Shield V2 Library  ; the Motor FeatherWing (added in a later milestone)
